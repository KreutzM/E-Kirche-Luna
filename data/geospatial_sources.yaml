sources:
  G01:
    title: "3D-Gebäudemodell Hessen LoD2 — Elisabethkirche"
    provider: "Hessisches Landesamt für Bodenmanagement und Geoinformation"
    product: "INSPIRE-WFS HE Gebäude — 3D LoD2"
    lod2_quality:
      official_product_page: "https://hvbg.hessen.de/landesvermessung/geotopographie/3d-daten/3d-gebaeudemodelle"
      vertical_accuracy_m_approx: 1.0
      horizontal_accuracy: "Corresponds to underlying ALKIS/ATKIS object geometry."
      caveat: "Complex or unrecognized roof forms may have larger deviations; LoD2 roofs are standardized/generalized."
    feature_type: "bu-core3d:Building"
    feature_id: "Building_DEHE06210000EgxB"
    source_url: "https://inspire-hessen.de/ows/services/org.2.ef07833e-78a6-4c2c-a895-e31de788aac3_wfs"
    catalog_url: "https://www.geoportal.hessen.de/spatial-objects/831"
    license: "Datenlizenz Deutschland — Zero — Version 2.0"
    license_url: "https://www.govdata.de/dl-de/zero-2-0"
    retrieved_at: "2026-09-26"
    source_record_date: "2020-03-09"
    raw_file: "sources/geodata/G01_Building_DEHE06210000EgxB.gml"
    source_crs: "WGS84 latitude, longitude with DHHN2016-NH elevation ordinates"
    part_count: 44
    position_count: 5233
    bounds_wgs84:
      latitude: [50.814724, 50.815124]
      longitude: [8.769454, 8.770473]
      elevation_m: [183.435, 263.553]
    derived_horizontal_minimum_rectangle:
      long_axis_m: 70.359
      short_axis_m: 44.378
      long_axis_degrees_from_east: 7.406
      rectangle_center_wgs84: [50.81490888, 8.76997514]
      method: "Convex hull of all G01 surface coordinates projected to a local tangent plane at the approximate crossing anchor; minimum-area rectangle over hull edge orientations. Reproducible with scripts/analyze_lod2_reference.py."
    crossing_anchor_crosscheck:
      method: "Shift the G01 rectangle center 14.75 m eastward along its long axis using the P01 west/east asymmetry."
      candidate_wgs84: [50.81492596, 8.77018310]
      offset_from_project_crossing_anchor_m: { east: 0.781, north: 0.329 }
      interpretation: "The candidate is within 0.85 m of the existing approximate OSM-derived project anchor. This checks the anchor at coarse geodata level; it is not a survey accuracy statement."
    derived_total_vertical_extent_m: 80.118
    published_accuracy:
      horizontal_m: 0.5
      vertical_m: 1.0
    use: "reference_geometry_only"
    limitations: "Generalized LoD2 building geometry, not the detailed 3 mm conservation survey. Roof shapes for complex monuments may be simplified; do not override documented dimensions or conflicting modern photographs. The minimum rectangle is a geospatial cross-check, not a surveyed architectural dimension. The vertical datum-to-project-floor shift is approximate and used only for the comparison object."
  G02:
    title: "Potential detailed 3D survey and official virtual-tour evidence"
    source_records:
      official_church: "https://www.elisabethkirche.de/kirchenraum/sehenswuerdiges/allgemeines/rundgang"
      survey_provider_reference: "https://www.vermessung-arhelger.de/referenzen/"
      exterior_tour: "https://flyingimpressions.de/360%C2%B0/elisabethkirche/index.htm"
    published_claims:
      official_church: "The church's official page says a professional 3D recording was commissioned before the interior renovation and links an exterior virtual tour."
      survey_provider: "The provider's Elisabethkirche reference describes a full 3D scan/model and a 3 mm required accuracy for restoration documentation, including plans, sections and surfaces."
    relationship_between_records: "Not confirmed; do not assume the tour and the provider's scan deliverable are the same dataset."
    raw_point_cloud_or_mesh_publicly_linked: false
    reuse_license: "Not stated for the virtual tour or detailed survey deliverables. User authorized local experimental use of tour imagery; review before redistribution."
    retrieved_at: "2026-09-27"
    use: "visual_exterior_geometry_reference_only"
    action: "Use the four published tour panorama front faces locally for visual roof and mass checks as instructed by the user. Keep source page, panorama IDs and tile hashes in sources/virtual_tour_metadata.json; resolve reuse terms before distributing the imagery."
    limitations: "The public tour exposes four partial-frame cube panoramas, but no world camera positions or survey export. They are not metrically calibrated photo sets. The provider's project page documents service scope and required accuracy, not access to detailed survey deliverables. The relation between the tour and the separately described 3 mm scan is unconfirmed."
  G03:
    title: "Hessian DGM1 terrain samples for evidence-camera height priors"
    provider: "Hessisches Landesamt für Bodenmanagement und Geoinformation"
    source_url: "https://inspire-hessen.de/raster/dgm1/ows"
    product_page: "https://hvbg.hessen.de/landesvermessung/geotopographie/3d-daten/digitale-gelaendemodelle"
    coverage_id: "he_dgm1"
    retrieved_at: "2026-09-27"
    local_file: "sources/geodata/DGM1_camera_sites_20260927.tif"
    source_crs: "ETRS89 / UTM zone 32N, DHHN2016_NH"
    resolution_m: 1
    published_vertical_accuracy: "up to ±0.3 m; actual accuracy depends on terrain, vegetation and acquisition date"
    sha256: "0efd2104e7a09fa4fd04259848951844af2d74fb5b8adb8a679212f4b7931f43"
    use: "Camera-site terrain-ground samples for soft local-Z priors only; not church-floor survey evidence."
    limitations: "The approximate project-origin ground sample is not a measured interior floor datum. M05/M06 EXIF absolute altitudes conflict with sampled ground, so those tags are not treated as camera-Z constraints. Actual photographer eye heights remain unknown."