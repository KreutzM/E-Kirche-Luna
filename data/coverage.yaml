west:
  status: strong
  notes: "Multiple modern facade/portal/tower views. M25 adds a 3795x4744 southwest west-facade view with 15 mm lens metadata, but the Commons page location and embedded EXIF GPS differ by about 15 m; diagnostic overlays do not yet establish a solved camera or a full silhouette pass."
south:
  status: strong
  notes: "Several modern and historic views."
north:
  status: strong
  notes: "Several modern and historic views plus sacristy."
southeast_triconch:
  status: strong
  notes: "Multiple modern views include M20's full southeast composition, M18's wide south-choir roof view, M21's high-resolution portrait roof detail, and M23's high-resolution SE view with Commons camera coordinates, recorded 315° heading, Canon EOS 550D and 18 mm focal length. M18/M21 share a mapped camera position and cardinal NW direction; 315° there is only the nominal sector center. M20 provides 28 mm focal length but no usable camera position."
east:
  status: medium
  notes: "Historic H06 provides a combined east/north-conch and sacristy view from the east, but only as a low-resolution preview with no confirmed capture date. Use for broad component ordering only. Modern direct east coverage remains a gap."
northeast:
  status: medium
  notes: "Sacristy and historic NE evidence available."
roof:
  status: improved_but_partial
  notes: "M21 adds a close south-choir roof profile. Four local cube-face extracts from the official exterior tour (T01-T04) add elevated oblique views of the overall roof arrangement and east choir. Their panorama labels do not disclose world camera positions, so they are geometry references only and do not close the camera-calibration gap."
remote_tower_roof:
  status: qualitative_only
  notes: "M22 provides a distant southwest tower/global-order view; M24 adds a 260 mm telephoto view from Spiegelslustturm. M24 shows the west tower pair and part of the roofscape, while foreground buildings crop lower masses and the east choir. Neither remote view has a usable camera pose; use them only as qualitative silhouette references."
dataset:
  manifest_records: 43
  downloaded_records: 43
  contact_sheets: [overview, west, south, north, remote, plans, historic, virtual_tour]
  provenance_file: sources/commons_download_metadata.jsonl
  additional_provenance_file: sources/virtual_tour_metadata.json
  notes: "Commons references passed the licence filter. Four front cube faces from the public exterior tour are cached locally for this experiment; reuse terms are unstated and user authorization covers local use until after the goal. Do not redistribute these images before resolving reuse terms. H06 is a LAGIS/CVMA east-view preview cached locally; its capture date and reuse rights are not stated, and local experimental use is user-authorized. It is only 250 × 333 pixels and supports broad component ordering, not measurement. Tour images have no published world camera positions. M20 is a high-resolution southeast exterior comparison (28 mm; no camera position); M18/M21 document south-choir roof geometry and share Commons camera coordinates/cardinal NW direction, with 24 mm and 29 mm focal lengths. M22 adds a distant southwest skyline view for tower silhouette only. M23 adds a high-resolution GPS/heading/focal-supported SE view, with camera pose height and pitch still unresolved. M24 adds a 260 mm distant view of the west towers and partial roofscape from Spiegelslustturm; no camera coordinates or heading are published and foreground buildings crop the lower church, so it is qualitative only. G01 is open Hessian LoD2 geometry used as a generalized reference, not a replacement for dimensions or current photographs. The separate Arhelger 3 mm scan/model is listed as a project reference but no download is linked; it must not be conflated with the 2018 PIX4D Freiburg case study. Modern direct-east photography remains unavailable."
