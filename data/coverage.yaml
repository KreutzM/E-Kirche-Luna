  notes: "The 35 selected Commons references passed the licence filter. Four front cube faces from the public exterior tour are also cached locally as T01-T04 for this experiment; their reuse licence is unstated, and the user authorized local use with licence review deferred until after the goal. Do not redistribute these image files before resolving reuse terms. The tour images are perspective geometry references only and have no published world camera positions. M20 is a high-resolution southeast exterior comparison (28 mm; no camera position); M18/M21 document south-choir roof geometry and share Commons camera coordinates/cardinal NW direction, with 24 mm and 29 mm focal lengths. M22 adds a distant southwest skyline view for tower silhouette only. G01 is the open Hessian LoD2 building geometry for the whole church and is used as a generalized reference, not a replacement for dimensional records or current photographs. The separately described detailed 3 mm scan remains inaccessible, and its relationship to the tour is unconfirmed. Modern direct-east photography remains unavailable."
