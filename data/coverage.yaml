southeast_triconch:
  status: strong
  notes: "Multiple modern views including M20's full southeast composition, M18's wide south-choir roof view and M21's high-resolution portrait roof detail. M18/M21 Commons pages record the same camera coordinates and cardinal NW direction; 315° is only the nominal center, not a degree-level bearing. Their local height/aim are inferred. M20 provides a 28 mm focal length but no usable camera position."
east:
  status: medium
  notes: "Historic H06 provides a combined east/north-conch and sacristy view from the east, but only as a low-resolution preview with no confirmed capture date. Use for broad component ordering only. Modern direct east coverage remains a gap."
northeast:
  status: medium
  notes: "Sacristy and historic NE evidence available."
roof:
  status: improved_but_partial
  notes: "M21 adds a close south-choir roof profile. Four local cube-face extracts from the official exterior tour (T01-T04) add elevated oblique views of the overall roof arrangement and east choir. Their panorama labels do not disclose world camera positions, so they are geometry references only and do not close the camera-calibration gap."
dataset:
  manifest_records: 40
  downloaded_records: 40
  contact_sheets: [overview, west, south, north, plans, historic, virtual_tour]
  provenance_file: sources/commons_download_metadata.jsonl
  additional_provenance_file: sources/virtual_tour_metadata.json
  notes: "Commons references passed the licence filter. Four front cube faces from the public exterior tour are cached locally for this experiment; reuse terms are unstated and user authorization covers local use until after the goal. Do not redistribute these images before resolving reuse terms. H06 is a LAGIS/CVMA east-view preview cached locally; its capture date and reuse rights are not stated, and local experimental use is user-authorized. It is only 250 × 333 pixels and supports broad component ordering, not measurement. Tour images have no published world camera positions. M20 is a high-resolution southeast exterior comparison (28 mm; no camera position); M18/M21 document south-choir roof geometry and share Commons camera coordinates/cardinal NW direction, with 24 mm and 29 mm focal lengths. M22 adds a distant southwest skyline view for tower silhouette only. G01 is open Hessian LoD2 geometry used as a generalized reference, not a replacement for dimensions or current photographs. The separately described detailed 3 mm scan remains inaccessible, and its relation to the tour is unconfirmed. Modern direct-east photography remains unavailable."
