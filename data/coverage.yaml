  contact_sheets: [overview, west, south, north, plans]
  provenance_file: sources/commons_download_metadata.jsonl
  notes: "All selected Commons images passed the licence filter. M20 is a high-resolution southeast exterior comparison (28 mm; no camera position); M18/M21 document south-choir roof geometry and share Commons camera coordinates/cardinal NW direction, with 24 mm and 29 mm focal lengths. M22 adds a distant southwest skyline view for tower silhouette only. G01 is the open Hessian LoD2 building geometry for the whole church and is used as a generalized reference, not a replacement for dimensional records or current photographs. The official church links an exterior tour and says it commissioned a professional 3D recording; a survey provider separately describes a full church scan/model with a 3 mm required accuracy. The relationship between these records is unconfirmed, raw point-cloud/mesh files are not publicly linked, and no reuse licence is stated, so they are recorded as a visual/source lead only. Modern direct-east photography remains unavailable."
