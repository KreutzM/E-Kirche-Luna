iteration: 6
model: blender/scene/elisabethkirche.blend
evidence_order: documented_dimensions_then_modern_photographs_then_historical_plans
views:
  W:
    camera: VAL_W
    evidence_ids: [M10, M11, P07]
    comparison: approximate_frontal_elevation
    landmarks:
      - id: west_tower_pair
        expected: "Two towers flank a lower central west-front mass; the documented tower height is approximately 80 m."
        observed: "The pair reads and reaches the documented approximate 80 m height after applying the mapped 7.13 degree building alignment; shafts and belfry remain plain blocks. Pinnacles were removed until the massing gate passes."
        status: partial
      - id: central_west_gable
        expected: "Central gable remains below the tower shafts and meets the nave roof."
        observed: "The west gable now spans the tower-front plane and joins the nave roof; the central gable profile still needs a closer comparison against P07 and M10."
        status: partial
  S:
    camera: VAL_S
    evidence_ids: [M04, M05]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: hall_roof_and_south_conch
        expected: "High nave roof continues into the transept and polygonal south choir arm."
        observed: "With the corrected portrait sensor fit the official M04 view is almost entirely a near wall. The raw GPS conversion lies within the revised south-conch outline; the earlier 6.3 m south offset and four west/south diagnostic poses near the modeled west tower do not recover the source composition and are occluded by the coarse masses. No M04 camera fit is accepted; roof joins and the long south-side silhouette remain unvalidated."
        status: unresolved
      - id: six_bay_hall_rhythm
        expected: "Six-bay hall length is legible in the side elevation."
        observed: "The current wall is a continuous blank mass; bay divisions have not been modeled at the massing stage, and no tested M04 view shows the full hall length."
        status: unresolved
  N:
    camera: VAL_N
    evidence_ids: [M06, M07, M15, M16]
    comparison: approximate_orthographic_elevation
    landmarks:
      - id: north_side_profile
        expected: "Long hall, crossing/transept, east choir and two-tower west end form a coherent stepped profile."
        observed: "The long hall, crossing, east end and west tower form a gross profile. The wall is continuous and blank; bay rhythm is deferred to openings."
        status: partial
  SE:
    camera: VAL_SE
    evidence_ids: [M02, M03, M19]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: triconch_and_roof_turret
        expected: "Three conches surround the crossing and the current roof turret rises from the roofscape."
        observed: "Iteration 6 uses a 28.3 mm active equivalent sensor width derived from M02's saved 3696x3053 crop and shifts the visual-fit target west/down to [-15, 0, 29] m based on candidate renders. The tower pair, roof turret and eastern conch now occupy approximately the same horizontal bands as the source, and overall frame width is close. The tower pair remains slightly left; more importantly, coarse polygonal conches and broad, angular roof masses diverge from the visible steep roof and stepped facade silhouette. Camera pose is still an inferred fit because M02 has no heading; do not count framing as proof of geometric fit."
        status: unresolved
      - id: sacristy
        expected: "Two-storey sacristy adjoins the north-east choir with a pyramidal roof."
        observed: "A separate sacristy body and pyramid roof are present; attachment and footprint need refinement against M15-M17."
        status: partial
acceptance:
  massing_gate_passed: false
  reason: "Iteration 6 corrects the M02 active sensor width from its saved crop and documents a west/down visual-fit target. The overall frame scale and landmark ordering improve, but camera pose is inferred and the tower/turret placement and roof/conch silhouette still visibly diverge. The M04 south-side validation also fails: raw GPS lies inside the revised footprint, while the offset camera remains dominated by the near wall. Do not start buttresses or decorative modeling until dimensional and silhouette checks pass."
