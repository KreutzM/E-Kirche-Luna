iteration: 6
model: blender/scene/elisabethkirche.blend
evidence_order: documented_dimensions_then_modern_photographs_then_historical_plans
views:
  W:
    camera: VAL_W
    evidence_ids: [M10, M11, P07]
    comparison: approximate_frontal_elevation
    landmarks:
      - id: west_tower_pair
        expected: "Two towers flank a lower central west-front mass; the documented tower height is approximately 80 m."
        observed: "The pair reads and reaches the documented approximate 80 m height after applying the mapped 7.13 degree building alignment; shafts and belfry remain plain blocks. Pinnacles were removed until the massing gate passes."
        status: partial
      - id: central_west_gable
        expected: "Central gable remains below the tower shafts and meets the nave roof."
        observed: "The west gable now spans the tower-front plane and joins the nave roof; the central gable profile still needs a closer comparison against P07 and M10."
        status: partial
  S:
    camera: VAL_S
    evidence_ids: [M05]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: hall_roof_and_south_conch
        expected: "High nave roof continues into the transept and polygonal south choir arm."
        observed: "Iteration 10 uses M05's GPS and recorded 30 mm equivalent lens with inferred target [0, -10, 18] m. Target-height diagnostics place the roof turret, conch roof peak and facade base closer together to their source image positions than the previous z=23 m aim; the render's blank wall masses and simplified roof surfaces still diverge. M04 remains unresolved: its raw GPS pose falls inside the conch mass and its offset tests fail."
        status: partial
      - id: six_bay_hall_rhythm
        expected: "Six-bay hall length is legible in the side elevation."
        observed: "The M05 view captures the south elevation, but the current wall is a continuous blank mass and bay divisions have not been modeled at the massing stage."
        status: unresolved
  M21:
    camera: VAL_M21
    evidence_ids: [M21]
    comparison: gps_heading_focal_supported_target_inferred
    landmarks:
      - id: south_choir_roof_profile
        expected: "The south-choir roof rises from a polygonal wall/eaves line to a steep roof profile; the crossing turret is visible behind it."
        observed: "The dedicated camera retains Commons GPS, 315-degree heading and 29 mm focal length. Target-height tests z=20–32 m do not repair horizontal registration. A separate +15-degree yaw diagnostic aligns the broad roof/turret order better, but conflicts with the recorded 315-degree heading and is not accepted. The G01 footprint plus P01 asymmetry gives a crossing candidate within 0.85 m of the current OSM-derived anchor, so a gross origin shift is not supported as the explanation. A temporary G01 wire overlay confirms broad plan registration but its generalized roof edges cannot decide the remaining image difference. The south-east mass arrangement or heading precision still needs resolution; no pose or geometry change is accepted."
        status: unresolved
  N:
    camera: VAL_N
    evidence_ids: [M06, M07, M15, M16]
    comparison: approximate_orthographic_elevation
    landmarks:
      - id: north_side_profile
        expected: "Long hall, crossing/transept, east choir and two-tower west end form a coherent stepped profile."
        observed: "The long hall, crossing, east end and west tower form a gross profile. The wall is continuous and blank; bay rhythm is deferred to openings."
        status: partial
  SE:
    camera: VAL_SE
    evidence_ids: [M02, M03, M19, M20, M21, G01]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: triconch_and_roof_turret
        expected: "Three conches surround the crossing and the current roof turret rises from the roofscape."
        observed: "Iteration 6 uses a 28.3 mm active equivalent sensor width derived from M02's saved 3696x3053 crop and shifts the visual-fit target west/down to [-15, 0, 29] m based on candidate renders. M20 independently confirms the southeast ordering and adds a full current exterior composition. M21 shows the south-choir roof profile in close detail and now has its own Commons-location/heading-based camera candidate. The model's polygonal conches and broad angular roof masses still diverge from these references. M02 has no heading, while M21's target distance and pitch remain inferred; neither camera framing alone proves geometric fit."
        status: unresolved
      - id: sacristy
        expected: "Two-storey sacristy adjoins the north-east choir with a pyramidal roof."
        observed: "A separate sacristy body and pyramid roof are present; attachment and footprint need refinement against M15-M17."
        status: partial
acceptance:
  massing_gate_passed: false
  reason: "Iteration 10 refines M05's inferred aim to [0, -10, 18] m using the turret, conch roof peak and facade base as landmarks. M05 remains a partial comparison. A 32 m conch-roof test was too high; 29 m remains the low-confidence geometry value after the 30 m test did not improve M02 and M05 together. M20 adds an independent southeast view; M21 now has a separate camera using Commons location/heading and recorded focal length, with target and crop still inferred. M02 still diverges in roof/conch silhouette, M05's blank wall masses and simplified roof forms remain partial, and M04 remains unresolved. Keep the gate closed until the dimensional and silhouette checks pass."
