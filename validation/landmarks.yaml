iteration: 6
model: blender/scene/elisabethkirche.blend
evidence_order: documented_dimensions_then_modern_photographs_then_historical_plans
views:
  W:
    camera: VAL_W
    evidence_ids: [M10, M11, P07]
    comparison: approximate_frontal_elevation
    landmarks:
      - id: west_tower_pair
        expected: "Two towers flank a lower central west-front mass; the documented tower height is approximately 80 m."
        observed: "The pair reads and reaches the documented approximate 80 m height after applying the mapped 7.13 degree building alignment; shafts and belfry remain plain blocks. M10/M11 overlays against the orthographic proxy show different apparent tower heights and perspective displacement, so they do not isolate a tower-geometry error. Pinnacles were removed until the massing gate passes."
        status: partial
      - id: central_west_gable
        expected: "Central gable remains below the tower shafts and meets the nave roof."
        observed: "The west gable now spans the tower-front plane and joins the nave roof; the central gable profile still needs a closer comparison against P07 and M10."
        status: partial
  S:
    camera: VAL_S
    evidence_ids: [M05]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: hall_roof_and_south_conch
        expected: "High nave roof continues into the transept and polygonal south choir arm."
        observed: "Iteration 10 uses M05's GPS and recorded 30 mm equivalent lens with inferred target [0, -10, 18] m. Target-height diagnostics place the roof turret, conch roof peak and facade base closer together to their source image positions than the previous z=23 m aim; the render's blank wall masses and simplified roof surfaces still diverge. M04 remains unresolved: its raw GPS pose falls inside the conch mass and its offset tests fail."
        status: partial
      - id: six_bay_hall_rhythm
        expected: "Six-bay hall length is legible in the side elevation."
        observed: "The M05 view captures the south elevation, but the current wall is a continuous blank mass and bay divisions have not been modeled at the massing stage."
        status: unresolved
  M18:
    camera: VAL_M18
    evidence_ids: [M18, M21]
    comparison: gps_cardinal_heading_focal_supported_inferred_target
    landmarks:
      - id: south_conch_roof_turret_and_west_tower_order
        expected: "From the elevated southeast/south view, the south conch and high crossing roof-turret are in the foreground/right of the west-tower pair; the nave roof continues to the right."
        observed: "The Commons source records a cardinal NW camera direction; 330 degrees is an inferred visual-fit candidate within that sector. The M18 24 mm landscape candidate places the conch, turret, tower fragments and nave roof in a closer broad order than the nominal 315-degree candidate, but simplified massing remains visibly different."
        status: partial
  M21:
    camera: VAL_M21
    evidence_ids: [M21]
    comparison: gps_heading_focal_supported_target_inferred
    landmarks:
      - id: south_choir_roof_profile
        expected: "The south-choir roof rises from a polygonal wall/eaves line to a steep roof profile; the crossing turret is visible behind it."
        observed: "The dedicated camera retains Commons GPS and 29 mm focal length; the source direction is cardinal NW, with 315 degrees only its nominal center. A diagnostic matrix varies bearing (325/330/335 degrees) and target height (z=17/22/27/32 m); the earlier 325/z=32 overlay was a candidate render, not the saved VAL_M21 view. Framing changes substantially across this matrix, so no unique pose or geometry residual is established. The 20 m roof-turret rise remains a low-confidence candidate supported by other fixed-camera diagnostics, not by this M21 overlay alone. M18, photographed from the same mapped point at 24 mm, is not independent camera geometry. Roof edges and coarse wall/conch silhouettes remain unresolved. Keep the gate open pending joint silhouette validation."
        status: unresolved
  N:
    camera: VAL_N
    evidence_ids: [M06, M07, M15, M16]
    comparison: approximate_orthographic_elevation
    landmarks:
      - id: north_side_profile
        expected: "Long hall, crossing/transept, east choir and two-tower west end form a coherent stepped profile."
        observed: "The long hall, crossing, east end and west tower form a gross profile. The wall is continuous and blank; bay rhythm is deferred to openings. M06 supplies GPS and focal metadata, but not heading. Temporary GPS-based perspective tests yield only a broad framing candidate; tower and wall/roof contours remain displaced, while the saved N view is still an orthographic proxy. Keep this landmark unresolved."
        status: partial
  SE:
    camera: VAL_SE
    evidence_ids: [M02, M03, M18, M19, M20, M21, G01]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: triconch_and_roof_turret
        expected: "Three conches surround the crossing and the current roof turret rises from the roofscape."
        observed: "Iteration 25 changes all three conch body and roof outlines from a pointed tip to a flat terminal facet, using an inferred 4.5 m chord estimated from P01 and visually cross-checked against M01/M18/M19 and generalized G01. The updated TOP and oblique renders show the faceted plan end, but the conch roofs still converge into overly simple single-point fans and their joints with the crossing/choir roofs remain visibly crude. The roof-turret height candidate from iteration 18 remains low-confidence; M02's target and M18/M21's local aim remain inferred. M20 independently confirms southeast ordering. This improves one footprint detail but does not establish an overall fit; keep the gate closed."
        status: unresolved
      - id: sacristy
        expected: "Two-storey sacristy adjoins the north-east choir with a pyramidal roof."
        observed: "A separate sacristy body and pyramid roof are present; attachment and footprint need refinement against M15-M17."
        status: partial
acceptance:
  massing_gate_passed: false
  reason: "Iteration 25 adds a low-confidence 4.5 m terminal chord to each conch from the faceted P01 plan, with broad shape support from modern M01/M18/M19 and generalized G01. TOP now shows cut polygonal ends; oblique views still show simplified single-point conch roofs and crude connections. The roof-turret rise remains low-confidence; M21 bearing/target diagnostics are framing-sensitive, M05 has blank wall masses, M04 remains unresolved, and the M18/M21 camera aims are inferred. G01 is generalized and cannot provide architectural metrology. Keep the gate closed until joint dimensional and multi-view silhouette checks pass."
auxiliary_evidence_checks:
  top_down_plan_extent:
    evidence_ids: [P01, M01, T01, T02, T03, T04]
    observed: "Iteration 24 reframes VAL_TOP around x=-15 m and widens it to 100 m; the complete current model extent is now visible. The render reads as the expected west-tower pair, long hall, crossing/transept arms and eastern choir/conch sequence. P01 supplies plan topology and proportions, while the elevated tour views give oblique roof context. The views do not establish a metric scale match or resolve conch facet dimensions."
    status: qualitative_partial
    geometry_change: false
  tour_overall_roof_order:
    evidence_ids: [T01, T02, T03, T04]
    observed: "The four elevated tour cube faces show the paired west towers, long hall roof, transept/choir roofs and east end together from broad oblique viewpoints. This independently confirms that the tour is useful for checking overall component ordering and the east-choir roof footprint. Because the panorama stations and image pose are unpublished, apparent scales cannot identify a metric geometry residual."
    status: qualitative_only
    geometry_change: false
  conch_terminal_facets:
    evidence_ids: [P01, M01, M18, M19, G01]
    observed: "Iteration 25 estimates a 4.5 m flat terminal chord from P01's three faceted apse outlines and applies it parametrically to all three conches. M01's aerial roof view and M18/M19's modern south-conch views support polygonal rather than pointed ends; G01 only corroborates the broad layout because its roof geometry is generalized. Updated TOP and oblique renders show the cut plan tips. The conch roof crests and joins to adjacent roofs still read as single-point tents with coarse intersections, so the roof form remains unresolved."
    status: partial
    geometry_change: true
