iteration: 4
model: blender/scene/elisabethkirche.blend
evidence_order: documented_dimensions_then_modern_photographs_then_historical_plans
views:
  W:
    camera: VAL_W
    evidence_ids: [M10, M11, P07]
    comparison: approximate_frontal_elevation
    landmarks:
      - id: west_tower_pair
        expected: "Two towers flank a lower central west-front mass; the documented tower height is approximately 80 m."
        observed: "The pair reads and reaches the documented approximate 80 m height after applying the mapped 7.13 degree building alignment; shafts and belfry remain plain blocks. Pinnacles were removed until the massing gate passes."
        status: partial
      - id: central_west_gable
        expected: "Central gable remains below the tower shafts and meets the nave roof."
        observed: "The west gable now spans the tower-front plane and joins the nave roof; the central gable profile still needs a closer comparison against P07 and M10."
        status: partial
  S:
    camera: VAL_S
    evidence_ids: [M04, M05]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: hall_roof_and_south_conch
        expected: "High nave roof continues into the transept and polygonal south choir arm."
        observed: "After applying the mapped 7.13 degree building alignment, the raw M04 GPS conversion still lies inside the coarse south-conch mass. The explicitly offset/fitted test camera escapes the wall-only view and shows two tower points, but the near conch/wall still dominates; the complete roof join and long south-side silhouette do not match M04."
        status: unresolved
      - id: six_bay_hall_rhythm
        expected: "Six-bay hall length is legible in the side elevation."
        observed: "The current wall is a continuous blank mass; bay divisions have not been modeled at the massing stage, and the test view does not yet show the full hall length."
        status: unresolved
  N:
    camera: VAL_N
    evidence_ids: [M06, M07, M15, M16]
    comparison: approximate_orthographic_elevation
    landmarks:
      - id: north_side_profile
        expected: "Long hall, crossing/transept, east choir and two-tower west end form a coherent stepped profile."
        observed: "The long hall, crossing, east end and west tower form a gross profile. The wall is continuous and blank; bay rhythm is deferred to openings."
        status: partial
  SE:
    camera: VAL_SE
    evidence_ids: [M02, M03, M19]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: triconch_and_roof_turret
        expected: "Three conches surround the crossing and the current roof turret rises from the roofscape."
        observed: "The candidate aim point shows the west-tower pair, roof turret and east conch in the same left-to-right order as M02 after applying the mapped 7.13 degree building alignment. The rendered building remains substantially smaller in frame and its coarse conch/roof silhouette is too block-like; GPS position and 27 mm equivalent focal length are unchanged, while aim remains an inferred candidate."
        status: unresolved
      - id: sacristy
        expected: "Two-storey sacristy adjoins the north-east choir with a pyramidal roof."
        observed: "A separate sacristy body and pyramid roof are present; attachment and footprint need refinement against M15-M17."
        status: partial
acceptance:
  massing_gate_passed: false
  reason: "Iteration 4 applies the OSM-derived 7.13 degree building alignment without changing the east/north/up world convention. It confirms the southeast landmark order but not image scale or silhouette. The south GPS pose falls inside the coarse mass and its offset test view still fails the side silhouette. West/east and side-elevation landmarks are also partial. Do not start buttresses or decorative modeling until dimensional and silhouette checks pass."
