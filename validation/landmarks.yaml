iteration: 28
model: blender/scene/elisabethkirche.blend
evidence_order: documented_dimensions_then_modern_photographs_then_historical_plans
views:
  W:
    camera: VAL_W
    evidence_ids: [M10, M11, P07]
    comparison: approximate_frontal_elevation
    landmarks:
      - id: west_tower_pair
        expected: "Two towers flank a lower central west-front mass; the documented tower height is approximately 80 m."
        observed: "The pair reads and reaches the documented approximate 80 m height after applying the mapped 7.13 degree building alignment; shafts and belfry remain plain blocks. M10/M11 overlays against the orthographic proxy show different apparent tower heights and perspective displacement, so they do not isolate a tower-geometry error. Pinnacles were removed until the massing gate passes."
        status: partial
      - id: central_west_gable
        expected: "Central gable remains below the tower shafts and meets the nave roof."
        observed: "The west gable now spans the tower-front plane and joins the nave roof; the central gable profile still needs a closer comparison against P07 and M10."
        status: partial
  S:
    camera: VAL_S
    evidence_ids: [M05]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: hall_roof_and_south_conch
        expected: "High nave roof continues into the transept and polygonal south choir arm."
        observed: "Iteration 10 uses M05's GPS and recorded 30 mm equivalent lens with inferred target [0, -10, 18] m. Target-height diagnostics place the roof turret, conch roof peak and facade base closer together to their source image positions than the previous z=23 m aim; the render's blank wall masses and simplified roof surfaces still diverge. M04's GPS point falls inside the coarse conch mass, but the close, upward-looking crop does not show a full silhouette and is retained only as qualitative facade/tower evidence; no M04 offset is accepted."
        status: partial
      - id: six_bay_hall_rhythm
        expected: "Six-bay hall length is legible in the side elevation."
        observed: "The M05 view captures the south elevation, but the current wall is a continuous blank mass and bay divisions have not been modeled at the massing stage."
        status: unresolved
  M18:
    camera: VAL_M18
    evidence_ids: [M18, M21]
    comparison: gps_cardinal_heading_focal_supported_inferred_target
    landmarks:
      - id: south_conch_roof_turret_and_west_tower_order
        expected: "From the elevated southeast/south view, the south conch and high crossing roof-turret are in the foreground/right of the west-tower pair; the nave roof continues to the right."
        observed: "The Commons source records a cardinal NW camera direction; 330 degrees is an inferred visual-fit candidate within that sector. The M18 24 mm landscape candidate places the conch, turret, tower fragments and nave roof in a closer broad order than the nominal 315-degree candidate, but simplified massing remains visibly different."
        status: partial
  M21:
    camera: VAL_M21
    evidence_ids: [M21]
    comparison: gps_heading_focal_supported_target_inferred
    landmarks:
      - id: south_choir_roof_profile
        expected: "The south-choir roof rises from a polygonal wall/eaves line to a steep roof profile; the crossing turret is visible behind it."
        observed: "The dedicated camera retains Commons GPS and 29 mm focal length; the source direction is cardinal NW, with 315 degrees only its nominal center. A diagnostic matrix varies bearing (325/330/335 degrees) and target height (z=17/22/27/32 m); the earlier 325/z=32 overlay was a candidate render, not the saved VAL_M21 view. Framing changes substantially across this matrix, so no unique pose or geometry residual is established. The 20 m roof-turret rise remains a low-confidence candidate supported by other fixed-camera diagnostics, not by this M21 overlay alone. M18, photographed from the same mapped point at 24 mm, is not independent camera geometry. Roof edges and coarse wall/conch silhouettes remain unresolved. Keep the gate open pending joint silhouette validation."
        status: unresolved
  N:
    camera: VAL_N
    evidence_ids: [M06, M07, M15, M16]
    comparison: approximate_orthographic_elevation
    landmarks:
      - id: north_side_profile
        expected: "Long hall, crossing/transept, east choir and two-tower west end form a coherent stepped profile."
        observed: "The long hall, crossing, east end and west tower form a gross profile. The wall is continuous and blank; bay rhythm is deferred to openings. M06 supplies GPS and focal metadata, but not heading. Temporary GPS-based perspective tests yield only a broad framing candidate; tower and wall/roof contours remain displaced, while the saved N view is still an orthographic proxy. Keep this landmark unresolved."
        status: partial
  SE:
    camera: VAL_SE
    evidence_ids: [M02, M03, M18, M19, M20, M21, G01]
    comparison: approximate_gps_and_focal_view
    landmarks:
      - id: triconch_and_roof_turret
        expected: "Three conches surround the crossing and the current roof turret rises from the roofscape."
        observed: "Iteration 26 replaces the three single-point conch fans with longitudinal hip roofs whose raised center ridges reach the terminal chord. Iteration 28 limits the high transept-cross roof to the crossing square; the north and south arm roofs now occupy their own straight reaches to the conches instead of overlapping the high roof across those spans. Updated M18, M21, SE and NE renders show the revised transitions, but roof proportions, crossing/choir joints and overall silhouettes remain visibly simplified against M01/M02/M18-M20. The roof-turret rise remains low-confidence; M02's target and M18/M21's local aims remain inferred. This improves roof topology but does not establish an overall fit; keep the gate closed."
        status: unresolved
      - id: sacristy
        expected: "Two-storey sacristy adjoins the north-east choir with a pyramidal roof."
        observed: "Iteration 27 moves the inferred sacristy footprint east to meet the north wall of the east choir and models its two-bay east-west length separately from its north-south width (10.0 × 7.5 m). P01 and M15-M17 support a side-attached two-bay mass with a pyramidal roof; G01's generalized footprint is a broad positional cross-check. VAL_TOP and VAL_NE now show the eastern attachment. Exact footprint, roof proportions and wall elevations remain low-confidence, and the blank mass cannot yet be compared against the facade details."
        status: partial
acceptance:
  massing_gate_passed: false
  reason: "Iteration 28 limits the high transept-cross roof to the crossing square so it no longer duplicates the lower straight-arm roofs. Iteration 27 repositions the north-east sacristy against the east choir and separates its inferred 10.0 m east-west length from its 7.5 m north-south width, using the plan/photos with G01 only as a broad check. Iteration 26 adds continuous longitudinal hips to the three conch roofs and aligns conch eaves with adjoining gable roofs; the TOP footprint retains its low-confidence 4.5 m terminal facets. Conch body heights remain inferred and oblique silhouettes/roof intersections remain simplified against modern photos. The roof-turret rise remains low-confidence; M21 bearing/target diagnostics are framing-sensitive, M05 has blank wall masses, and M18/M21 camera aims are inferred. M04 is a close facade/tower view without a full silhouette and is not a massing gate camera. G01 is generalized and cannot provide architectural metrology. Keep the gate closed until joint dimensional and multi-view silhouette checks pass."
auxiliary_evidence_checks:
  m22_distant_tower_and_global_silhouette:
    evidence_ids: [M22]
    observed: "Commons gives a southwest viewpoint and 86 mm focal length. Diagnostic renders retain the page GPS-derived camera XY and test bearings 15/20/25 degrees plus local camera heights 75/100/125 m. A heading near 18-19 degrees moves the projected tower pair closer to the source horizontally, but the local height/aim remains inferred, the lower church is hidden by foreground, and the simplified outline still differs. This source extends qualitative tower-order coverage only; no dimensions or geometry are accepted from it."
    status: qualitative_only
    geometry_change: false
  m23_southeast_camera_and_silhouette:
    evidence_ids: [M23]
    observed: "Commons provides a mapped southeast viewpoint, explicit 315-degree heading, 18 mm focal length and high-resolution source image. Nine diagnostic renders fix XY, heading and optics while varying eye-level Z, aim distance and target height. Selected overlays remain visibly displaced from the church; target-height changes do not explain the offset. The pose cannot be solved from this comparison yet, and the two published capture dates conflict. No geometry change is justified."
    status: unresolved
    geometry_change: false
  top_down_plan_extent:
    evidence_ids: [P01, M01, T01, T02, T03, T04]
    observed: "Iteration 24 reframes VAL_TOP around x=-15 m and widens it to 100 m; the complete current model extent is now visible. The render reads as the expected west-tower pair, long hall, crossing/transept arms and eastern choir/conch sequence. P01 supplies plan topology and proportions, while the elevated tour views give oblique roof context. The views do not establish a metric scale match or resolve conch facet dimensions."
    status: qualitative_partial
    geometry_change: false
  tour_overall_roof_order:
    evidence_ids: [T01, T02, T03, T04]
    observed: "The four elevated tour cube faces show the paired west towers, long hall roof, transept/choir roofs and east end together from broad oblique viewpoints. This independently confirms that the tour is useful for checking overall component ordering and the east-choir roof footprint. Because the panorama stations and image pose are unpublished, apparent scales cannot identify a metric geometry residual."
    status: qualitative_only
    geometry_change: false
  conch_terminal_facets:
    evidence_ids: [P01, M01, M18, M19, G01]
    observed: "Iteration 25 estimates a 4.5 m flat terminal chord from P01's three faceted apse outlines and applies it parametrically to all three conches. M01's aerial roof view and M18/M19's modern south-conch views support polygonal rather than pointed ends; G01 only corroborates the broad layout because its roof geometry is generalized. Iteration 26 replaces the earlier single-point roof fans with longitudinal hip roofs. The current TOP and oblique renders show the cut plan tips and ridge direction; roof pitch, crest profile and connections to adjacent roofs still remain unresolved."
    status: partial
    geometry_change: true
  east_north_conch_historic_order:
    evidence_ids: [H06, H01, M16, M17]
    observed: "H06 adds a low-resolution historical view from the east that shows the east and north conches together with the sacristy. It helps check broad overlap and component order against the existing east historic view and modern sacristy details, but its small preview, unknown capture date and uncalibrated perspective do not validate dimensions or present-day roof form. The current VAL_E orthographic proxy remains qualitative."
    status: qualitative_partial
    geometry_change: false
  conch_roof_ridges_and_eave_joints:
    evidence_ids: [P08, M01, M02, M18, M19, M20, H06]
    observed: "Iteration 26 changes the conch roofs to paired faceted slopes meeting at a centerline ridge from spring to the terminal hip chord. The side-conch eaves meet the arm gables at z=24 m; the east-conch eaves meet the choir gable at z=23 m. Iteration 28 shortens the high transept-cross gable to the crossing square, eliminating its duplicate coverage of the straight arm roofs. East/SE source views support continuous ridges and hipped facets, but exact crest length and height are not metrically calibrated. Blender reports closed conch-roof meshes with no boundary/non-manifold edges or zero-area faces. Updated oblique renders improve the separation of the roof masses but crossing connections and proportions remain unresolved."
    status: partial
    geometry_change: true
  m23_southeast_whole_church:
    evidence_ids: [M23]
    observed: "Commons supplies GPS, explicit 315-degree heading, 18 mm focal length and image dimensions. Five selected overlays from the nine-pose diagnostic set show the modeled outline visibly displaced from the photo; changing target z shifts framing without resolving alignment. Camera Z and aim remain inferred, while the page description and EXIF disagree on capture year. This comparison establishes no geometric residual."
    status: unresolved
    geometry_change: false
  sacristy_position_and_footprint:
    evidence_ids: [P01, M15, M16, M17, G01]
    observed: "Iteration 27 places the sacristy north of the east choir with its west edge at the choir-bay start, rather than beside the crossing. The 10.0 × 7.5 m inferred footprint follows the two-bay plan/photo massing; G01's generalized ground lines span a similar east/north area but are not treated as a conservation measurement. Updated TOP and NE renders show the attached volume. Exact roof and facade fit remain open."
    status: partial
    geometry_change: true
