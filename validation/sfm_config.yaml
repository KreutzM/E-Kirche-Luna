schema_version: 1

# Work products under workspace_root are intentionally gitignored. The compact
# JSON result generated by scripts/sfm/run_colmap_sfm.py is versioned under
# validation/sfm_results/.
workspace_root: validation/sfm_work
result_root: validation/sfm_results

defaults:
  camera_model: SIMPLE_RADIAL
  max_image_size: 3200
  max_num_features: 12000
  estimate_affine_shape: true
  domain_size_pooling: true
  guided_matching: true
  use_gpu: false
  use_pose_priors: false

groups:
  core:
    description: >-
      Present-day exterior photos with broad cross-view coverage. Historic
      images, remote telephotos and virtual-tour cube faces are intentionally
      excluded from the first independent reconstruction.
    image_ids:
      - M01
      - M02
      - M03
      - M05
      - M06
      - M07
      - M08
      - M09
      - M10
      - M11
      - M15
      - M16
      - M18
      - M19
      - M20
      - M21
      - M23
      - M25

  southeast:
    description: >-
      Fallback overlap cluster around the southeast/east choir and roofscape.
      Use only if the core reconstruction fragments or fails to initialize.
    image_ids:
      - M01
      - M02
      - M03
      - M05
      - M16
      - M18
      - M19
      - M20
      - M21
      - M23

  west:
    description: >-
      Fallback west/southwest tower cluster. M25 is wide-angle and therefore
      remains a separate per-image SIMPLE_RADIAL camera.
    image_ids:
      - M08
      - M09
      - M10
      - M11
      - M25

  north:
    description: >-
      Fallback north/east cluster for testing whether the north-side imagery
      forms an independent connected component.
    image_ids:
      - M01
      - M06
      - M07
      - M15
      - M16
      - M17
