schema_version: 1

# Work products under workspace_root are intentionally gitignored. The compact
# JSON result generated by scripts/sfm/run_colmap_sfm.py is versioned under
# validation/sfm_results/.
workspace_root: validation/sfm_work
result_root: validation/sfm_results

defaults:
  camera_model: SIMPLE_RADIAL
  max_image_size: 3200
  max_num_features: 12000
  estimate_affine_shape: true
  domain_size_pooling: true
  guided_matching: true
  use_gpu: false
  use_pose_priors: false

groups:
  core:
    description: >-
      Present-day exterior photos with broad cross-view coverage. Historic
      images, remote telephotos and virtual-tour cube faces are intentionally
      excluded from the first independent reconstruction.
    image_ids:
      - M01
      - M02
      - M03
      - M05
      - M06
      - M07
      - M08
      - M09
      - M10
      - M11
      - M15
      - M16
      - M18
      - M19
      - M20
      - M21
      - M23
      - M25

  southeast:
    description: >-
      Fallback overlap cluster around the southeast/east choir and roofscape.
      Use only if the core reconstruction fragments or fails to initialize.
    image_ids:
      - M01
      - M02
      - M03
      - M05
      - M16
      - M18
      - M19
      - M20
      - M21
      - M23

  west:
    description: >-
      Fallback west/southwest tower cluster. M25 is wide-angle and therefore
      remains a separate per-image SIMPLE_RADIAL camera.
    image_ids:
      - M08
      - M09
      - M10
      - M11
      - M25

  north:
    description: >-
      Fallback north/east cluster for testing whether the north-side imagery
      forms an independent connected component.
    image_ids:
      - M01
      - M06
      - M07
      - M15
      - M16
      - M17

  bridge:
    description: >-
      Targeted connectivity test using only the strongest existing southeast,
      west and north anchors plus three newly curated broad exterior images.
      Success means verified overlap edges connect the formerly separate
      components; a low reprojection error alone is not sufficient.
    image_ids:
      - M02
      - M03
      - M20
      - M23
      - M09
      - M10
      - M11
      - M25
      - M06
      - M07
      - M26
      - M27
      - M28

  issue7_south_transition_existing:
    description: >-
      Temporary Issue #7 transition test using the established west/north
      anchors, M04/M05 as south intermediates, and the complete existing
      southeast/south component. M04 is feature-matching evidence only and is
      explicitly excluded as a whole-building geometry constraint.
    image_ids:
      - M09
      - M10
      - M11
      - M25
      - M26
      - M27
      - M04
      - M05
      - M02
      - M03
      - M18
      - M19
      - M20
      - M21
      - M23

  issue7_south_transition:
    description: >-
      Issue #7 controlled south-transition run: the west/north anchors, M04/M05
      as feature-matching intermediates, the complete existing southeast/south
      component, and only Tilman2007's 2021-09-02 frames 006-011 and 015-016.
      M04 is not a whole-building geometry constraint. No stitched panoramas,
      pose priors, Blender geometry, or georegistration are used.
    image_ids:
      - M09
      - M10
      - M11
      - M25
      - M26
      - M27
      - M04
      - M05
      - M02
      - M03
      - M18
      - M19
      - M20
      - M21
      - M23
      - M29
      - M30
      - M31
      - M32
      - M33
      - M34
      - M35
      - M36

  core_plus_bridges:
    description: >-
      Full present-day core plus M26-M28. Run only after the bridge group shows
      verified pairwise connectivity across previously separate directions.
    image_ids:
      - M01
      - M02
      - M03
      - M05
      - M06
      - M07
      - M08
      - M09
      - M10
      - M11
      - M15
      - M16
      - M18
      - M19
      - M20
      - M21
      - M23
      - M25
      - M26
      - M27
      - M28

  issue7_southwest_bridge:
    description: >-
      Final targeted graph-connectivity test for the remaining Issue #7 break.
      Uses established west/north anchors, representative south/southeast
      anchors, and exactly three newly curated single-frame south/southwest
      photographs M37-M39. Connectivity is evaluated before mapper quality.
    image_ids:
      - M09
      - M10
      - M11
      - M25
      - M26
      - M27
      - M04
      - M05
      - M02
      - M20
      - M23
      - M29
      - M34
      - M37
      - M38
      - M39
