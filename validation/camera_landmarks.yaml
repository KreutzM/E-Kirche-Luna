schema_version: 1
massing_requirements:
  minimum_accepted_views: 3
  recommended_directional_coverage:
    - west
    - south
    - north
    - southeast
  note: Prefer independent directions. A view may remain qualitative if its metadata are contradictory, but it must not drive geometry until a numerical fit is accepted.

