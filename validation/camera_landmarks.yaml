      position_sigma_m: [5.0, 5.0, 4.0]
      rotation_sigma_deg: 25.0
      focal_scale_sigma: 0.05
      principal_point_sigma_px: 80.0
    optimize:
      rotation: true
      position: true
      focal_scale: true
      principal_point: true
      radial_distortion: false
    robust_loss: soft_l1
    robust_f_scale: 2.0
    acceptance:
