review_status: reviewed
interpretation: >-
  Semantic assignments use BuildingPart position, extent, official
  heightAboveGround, terrain intersections and repeated roof/eave levels.
  They support coarse comparisons only. No G01 surface or generalized roof
  geometry is copied into Blender. Components whose segmentation crosses
  architectural boundaries or whose position alone is not decisive remain
  unmapped.
