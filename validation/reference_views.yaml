camera_parameters: camera_parameters.json
views:
  W:
    camera: VAL_W
    evidence: [M10, M11, P07]
    status: approximate_frontal_elevation
    note: "Modern west photographs support the silhouette, but downloaded metadata has no usable camera position; this is not an exact photo solve."
  S:
    camera: VAL_S
    evidence: [M05]
    status: inferred_target_fit_gps_and_focal_supported
    note: "M05 supplies GPS, 30 mm full-frame-equivalent focal length and a 2:3 portrait image. GPS-derived camera position is retained; target [0, -10, 18] m is inferred because heading is absent and best jointly places the turret, conch roof peak and facade base among tested target heights. The render supports only a partial gross south-side fit; plain wall masses and roof forms still differ. M04's separate GPS camera candidate remains unresolved."
  M18:
    camera: VAL_M18
    evidence: [M18, M21]
    status: gps_cardinal_heading_focal_supported_target_inferred
    note: "M18 provides a wide view and 24 mm EXIF focal length; M18 and M21 Commons pages give the same camera coordinates and cardinal NW direction. The numeric 315-degree direction is only the cardinal center. M18's 330-degree bearing, 32 m aim distance and z=32 m target are visual-fit inferences. The broad tower/conch/turret order improves, but the simplified wall/roof silhouette remains partial."
  M21:
    camera: VAL_M21
    evidence: [M21]
    status: gps_heading_focal_supported_target_inferred
    note: "The Commons page provides camera coordinates and cardinal NW, while the image metadata provides a 29 mm focal length and Canon EOS 550D. 315° is only the nominal center of NW, not an exact azimuth. Local camera height, cropped active sensor width and target pitch/distance are inferred. The selected 20 m low-confidence turret rise and 325° visual-fit candidate bring the broad conch/turret order closer in the photo overlay; wall, roof-edge and conch silhouettes still diverge. M18 is a wider framing from the same mapped location, not independent camera geometry. G01's plan/asymmetry cross-check places the crossing candidate within 0.85 m of the current anchor, but generalized roof geometry cannot resolve the remaining photo difference."
  SE:
    camera: VAL_SE
    evidence: [M02, M03, M18, M19, M20, M21]
    status: inferred_target_fit_gps_and_focal_supported
    note: "M02 supplies GPS, 27 mm full-frame-equivalent focal length and a 1.21:1 cropped image. The active sensor width is modelled as 28.3 mm equivalent for the saved crop; GPS-derived camera position is retained. The iteration-6 aim [-15, 0, 29] m shifts the image west/down based on test renders. M20 supplies an independent full southeast composition and 28 mm focal length but no camera position; M21 cross-checks south-choir roof shape from a close view. Neither replaces M02's camera solve. This remains a documented visual-fit candidate, not a solved camera; silhouette comparison still fails."
  N:
    camera: VAL_N
    evidence: [M06, M07, M15, M16]
    status: approximate_orthographic_elevation
    note: "Useful modern north coverage; exact camera pose is unavailable."
  E:
    camera: VAL_E
    evidence: [H01, P08]
    status: historical_only_approximate_elevation
    note: "No modern direct-east photograph is available in the curated set."
  NE:
    camera: VAL_NE
    evidence: [M01, M16, M17, H03]
    status: geometry_reference_approximate_camera
    note: "Geometry check only; camera pose is not solved from the aerial/sacristy references."
  TOP:
    camera: VAL_TOP
    evidence: [M01, P01]
    status: orthographic_plan_check
    note: "Top-down footprint/roof check; M01 is oblique and is not treated as a pinhole camera solve."
  SW:
    camera: null
    evidence: [M08, M09, M22]
    status: geometry_reference_only
    note: "M08 is explicitly marked do_not_camera_solve; M09 is a steep tower detail; M22 adds an elevated southwest skyline view for tower and overall mass silhouette only. Its 86 mm focal length and camera coordinates are recorded, but no heading or local camera height is provided, so it is not used for a camera solve."
