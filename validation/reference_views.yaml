camera_parameters: camera_parameters.json
views:
  W:
    camera: VAL_W
    evidence: [M10, M11, P07]
    status: approximate_frontal_elevation
    note: "Modern west photographs support the silhouette, but downloaded metadata has no usable camera position; this is not an exact photo solve. M10/M11 overlays against the orthographic proxy expose perspective-dependent tower-height and framing differences, so they support gross mass only and do not isolate geometric residuals."
  S:
    camera: VAL_S
    evidence: [M05]
    status: inferred_target_fit_gps_and_focal_supported
    note: "M05 supplies GPS, 30 mm full-frame-equivalent focal length and a 2:3 portrait image. GPS-derived camera position is retained; target [0, -10, 18] m is inferred because heading is absent and best jointly places the turret, conch roof peak and facade base among tested target heights. The render supports only a partial gross south-side fit; plain wall masses and roof forms still differ. M04's separate GPS camera candidate remains unresolved."
  M18:
    camera: VAL_M18
    evidence: [M18, M21]
    status: gps_cardinal_heading_focal_supported_target_inferred
    note: "M18 provides a wide view and 24 mm EXIF focal length; M18 and M21 Commons pages give the same camera coordinates and cardinal NW direction. The numeric 315-degree direction is only the cardinal center. M18's 330-degree bearing, 32 m aim distance and z=32 m target are visual-fit inferences. The broad tower/conch/turret order improves, but the simplified wall/roof silhouette remains partial."
  M21:
    camera: VAL_M21
    evidence: [M21]
    status: gps_heading_focal_supported_target_inferred
    note: "The Commons page provides camera coordinates and cardinal NW, while the image metadata provides a 29 mm focal length and Canon EOS 550D. 315° is only the nominal center of NW, not an exact azimuth. Local camera height, cropped active sensor width and target pitch/distance are inferred. Bearing/target diagnostics vary 325/330/335° and z=17/22/27/32 m; the earlier 325°/z=32 m overlay used a diagnostic render rather than the saved VAL_M21 camera. The source/render overlays show strong framing sensitivity, so no unique camera solution or geometry residual is established. M18 is a wider framing from the same mapped location, not independent camera geometry. Keep the M21 silhouette unresolved and the massing gate open."
  SE:
    camera: VAL_SE
    evidence: [M02, M03, M18, M19, M20, M21]
    status: inferred_target_fit_gps_and_focal_supported
    note: "M02 supplies GPS, 27 mm full-frame-equivalent focal length and a 1.21:1 cropped image. The active sensor width is modelled as 28.3 mm equivalent for the saved crop; GPS-derived camera position is retained. The iteration-6 aim [-15, 0, 29] m shifts the image west/down based on test renders. M20 supplies an independent full southeast composition and 28 mm focal length but no camera position; M21 cross-checks south-choir roof shape from a close view. Neither replaces M02's camera solve. This remains a documented visual-fit candidate, not a solved camera; silhouette comparison still fails."
  N:
    camera: VAL_N
    evidence: [M06, M07, M15, M16]
    status: approximate_orthographic_elevation
    note: "M06 supplies a point-of-view GPS location and 16 mm focal length (24 mm full-frame equivalent), but no heading. Its absolute EXIF altitude is not translated to project Z because ground elevation at the camera is unknown. The saved VAL_N remains an orthographic proxy. Temporary perspective candidates (bearings 205/215/225°, target distances 55/65/75 m and z=20/30/40 m) show framing sensitivity; H205/D65/z40 is only a broad visual-fit candidate. Tower and wall/roof silhouettes remain unresolved."
  E:
    camera: VAL_E
    evidence: [H01, P08]
    status: historical_only_approximate_elevation
    note: "No modern direct-east photograph is available in the curated set."
  NE:
    camera: VAL_NE
    evidence: [M01, M16, M17, H03]
    status: geometry_reference_approximate_camera
    note: "Geometry check only; camera pose is not solved from the aerial/sacristy references."
  TOP:
    camera: VAL_TOP
    evidence: [M01, P01]
    status: orthographic_plan_check
    note: "Top-down footprint/roof check is recentered at the midpoint of the inferred west/east extents and widened to 100 m because the previous 82 m frame clipped the west tower edge. M01 is oblique and is not treated as a pinhole camera solve. T01-T04 provide extra elevated visual roof context but have no solved camera poses."
  SW:
    camera: null
    evidence: [M08, M09, M22]
    status: geometry_reference_only
    note: "M08 is explicitly marked do_not_camera_solve; M09 is a steep tower detail. M22 has Commons camera coordinates and 86 mm equivalent focal length. Diagnostic renders retain its GPS-derived XY and test headings 15/20/25 degrees with candidate local heights 75/100/125 m; an intermediate heading near 18-19 degrees improves the horizontal tower-group placement, but no unique pose is established. Its distant foreground hides lower masses and the current global outline remains mismatched. Keep it as a qualitative tower/global-order check, not a metric camera solve or massing-gate view."
  M23:
    camera: null
    evidence: [M23]
    status: gps_focal_supported_visual_bearing_candidate_unresolved
    note: "Commons provides GPS, a 315-degree heading, Canon EOS 550D, 18 mm focal length and 5184x3456 dimensions. The local GPS-derived XY and optics are fixed. The camera-to-crossing bearing from the project anchor is 286.6 degrees. A temporary sweep from 280 to 315 degrees gives better broad horizontal placement near 300-302 than at 315; a 300-degree, 60 m, z=22 m pose is only a visual candidate. Tower-pair spacing, crossing-turret placement and roof silhouette remain inconsistent, so no pose or geometry is accepted. Eye-level Z, aim and fit bearing remain inferred. Commons description and EXIF conflict on capture dates (2021-06-20 and 2025-06-20); retain both."
  M24:
    camera: null
    evidence: [M24]
    status: qualitative_remote_tower_roof_only
    note: "The 4957x3298 Nikon D780 image was captured 2021-09-02 with a 260 mm focal length from Spiegelslustturm. No camera coordinates or heading are published. The long-lens frame shows the west tower pair and part of the roofscape, but foreground buildings crop the lower masses and east choir. Use only for qualitative tower/roof context; it cannot validate dimensions, full silhouette or the massing gate."
auxiliary_panorama_sources:
  T01-T04:
    source: "Official Flying Impressions exterior tour; four named aerial/raised cube panoramas."
    camera: null
    status: qualitative_geometry_reference_only
    note: "Front cube faces assembled locally at 3072x3072. World camera positions are not published; use for overall roof/choir ordering only, not metric comparison. Tile provenance and hashes are in sources/virtual_tour_metadata.json."
